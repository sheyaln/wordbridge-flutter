name: wordbridge
description: "Free, open-source AAC with customizable motor planning."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  archive: ^4.2.0
  crypto: ^3.0.7
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: ^11.0.0
  flutter_svg: ^2.3.0
  # The parser `flutter_svg` reads an SVG with, used directly to ask whether a
  # downloaded file is one it can draw before filing it (§4.67). A transitive
  # dependency either way; declared because this code imports it.
  xml: ^6.5.0
  flutter_tts: ^4.2.5
  go_router: ^18.0.0
  http: ^1.6.0
  image: ^4.9.2
  image_picker: ^1.2.3
  path: ^1.9.1
  path_provider: ^2.1.6
  # Hands an exported board file to the platform's own share sheet. Pinned
  # exactly: this reaches a UIActivityViewController and an Android chooser
  # through platform channels, and a range would let a patch change what the
  # one control for getting a board off the tablet does without a commit here.
  share_plus: 13.3.0
  # Runs the optional downloaded neural voice (REQUIREMENTS.md §4.5). Nothing
  # outside features/speech/neural/ talks to it, and a device that never
  # switches the voice on never loads a model.
  sherpa_onnx: ^1.13.6
  # Opens the database file directly, once, before drift is allowed to migrate
  # it — see features/backup/pre_migration.dart. Already in the tree underneath
  # drift; named here because lib/ imports it.
  sqlite3: ^3.5.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Runs the neural voice's timings on the tablet they are claimed for. A
  # simulator runs on the Mac's own CPU and can say nothing about latency.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.16.0

flutter:
  uses-material-design: true

  assets:
    - assets/symbols/core/
    # Emoji names and search words only. The pictures come from the device's
    # own font and are never bundled — see NOTICE.md.
    - assets/symbols/system-emoji/
